<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NightPath - Smarter Routes After Dark</title>
    <!-- Google Fonts for NightPath Design System -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <!-- Tailwind CSS Engine Fallback & Theme Setup -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              midnight: '#070a12',
              'glass-card': 'rgba(18, 24, 38, 0.85)',
              cyan: {
                400: '#00F0FF',
                500: '#00D0FF'
              }
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#070a12] text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

</html>
